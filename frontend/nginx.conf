server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads go up to 20 MB in the API; leave a little room for the form data.
    client_max_body_size 25m;

    # The browser calls /api/... on this server; nginx forwards it to the API container.
    # One origin for the browser, so the API needs no CORS setting.
    location /api/ {
        # Docker's DNS, asked again every 10 s, so a restarted API container (new address) is found.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /chat streams Server-Sent Events: send each piece at once and keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Single-page app: any other path is a React route, so serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
